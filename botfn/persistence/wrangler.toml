name = "botfn-persistence-service"
main = "src/index.cloudflare.ts"
# postgres.js needs the Node.js compatibility layer (Buffer, net) on Workers.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Set DATABASE_URL as a Wrangler secret before deploying:
# wrangler secret put DATABASE_URL

[vars]
# Add non-secret variables here if needed.

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
