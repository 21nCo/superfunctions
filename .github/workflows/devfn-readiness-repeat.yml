name: DevFn readiness repeat

# Runs the real-process @devfn/core tests that timed out on HTTP readiness
# (DEV-56) many times in a row, each run explicit and without retries, so a
# remaining timing or port dependency shows up as a failure here.

on:
  pull_request:
    branches: [dev, next, main]
    paths:
      - "devfn/config/**"
      - "devfn/ports/**"
      - "devfn/processes/**"
      - "devfn/compose/**"
      - "devfn/proxy/**"
      - "devfn/core/**"
      - ".github/workflows/devfn-readiness-repeat.yml"
  workflow_dispatch:
    inputs:
      iterations:
        description: Consecutive runs of the readiness tests
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  repeat:
    name: DevFn readiness tests, repeated
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the DevFn core workspaces from the root lockfile
        run: >-
          npm ci --ignore-scripts --include-workspace-root=false
          --workspace @clifn/core
          --workspace @devfn/config
          --workspace @devfn/processes
          --workspace @devfn/ports
          --workspace @devfn/compose
          --workspace @devfn/proxy
          --workspace @devfn/core

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Build workspace dependencies (@devfn/core imports their dist/)
        run: |
          for workspace in @clifn/core @devfn/config @devfn/processes @devfn/ports @devfn/compose @devfn/proxy; do
            npm run build --workspace "$workspace"
          done

      - name: Run the readiness tests repeatedly, without retries
        working-directory: devfn/core
        # bash -eo pipefail; the loop reads vitest's own status from PIPESTATUS.
        shell: bash
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '20' }}
          # Plain reporter lines, so each passed test can be counted.
          NO_COLOR: "1"
        run: |
          pattern='stops what an earlier attempt left running before the task runs again, and blocks every start while that cannot be verified'
          pattern+='|replaces a running lifecycle when its selected target changes behind a credential-like name'
          pattern+='|replaces a native process when an inherited ordinary allowlist value changes'
          pattern+='|restores the served certificate after its source was removed and a refused prior teardown'
          mkdir -p readiness-repeat-logs
          for iteration in $(seq 1 "$ITERATIONS"); do
            echo "::group::Iteration $iteration of $ITERATIONS"
            # Each file holds one of the four tests; --retry=0 makes any failure final.
            set +e
            ../../node_modules/.bin/vitest run --retry=0 --reporter=verbose -t "$pattern" \
              test/task-lifecycle.test.ts test/resources.test.ts test/startup-fixture.test.ts test/registered-domain-startup.test.ts \
              2>&1 | tee "readiness-repeat-logs/iteration-$iteration.log"
            # vitest's exit status, not tee's: an error after every test passed
            # (an unhandled error, a failed hook) still fails the iteration.
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            passed=$(grep -cE '^ +✓ .*(stops what an earlier attempt|selected target changes behind|inherited ordinary allowlist|removed and a refused prior teardown)' "readiness-repeat-logs/iteration-$iteration.log" || true)
            echo "Iteration $iteration: exit $status, $passed of 4 readiness tests passed"
            if [ "$status" -ne 0 ] || [ "$passed" -ne 4 ]; then
              echo "::error::Iteration $iteration failed: exit $status, $passed of 4 readiness tests passed"
              exit 1
            fi
          done
          echo "All $ITERATIONS iterations passed all 4 readiness tests."

      - name: Upload the iteration logs when an iteration failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devfn-readiness-repeat-logs
          path: devfn/core/readiness-repeat-logs/
          if-no-files-found: ignore
          retention-days: 14
