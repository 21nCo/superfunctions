name: CI

on:
  push:
    branches:
      - dev
      - next
      - main
  pull_request:
    branches:
      - dev
      - next
      - main
  workflow_dispatch:
  # Nightly full run of dev (the default branch).
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every other run (a push to dev/next/main, the nightly run, a
# manual run) gets a group of its own and always finishes: the release CI gate needs a successful full push run on the
# exact release commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    if: github.repository == '21nCo/superfunctions'
    runs-on: ubuntu-latest
    outputs:
      plan_mode: ${{ steps.plan.outputs.plan_mode }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      changed_files_count: ${{ steps.plan.outputs.changed_files_count }}
      run_js: ${{ steps.plan.outputs.run_js }}
      full_js: ${{ steps.plan.outputs.full_js }}
      has_js_build: ${{ steps.plan.outputs.has_js_build }}
      has_js_test: ${{ steps.plan.outputs.has_js_test }}
      has_js_lint: ${{ steps.plan.outputs.has_js_lint }}
      has_js_typecheck: ${{ steps.plan.outputs.has_js_typecheck }}
      js_build_filters: ${{ steps.plan.outputs.js_build_filters }}
      js_test_filters: ${{ steps.plan.outputs.js_test_filters }}
      js_lint_filters: ${{ steps.plan.outputs.js_lint_filters }}
      js_typecheck_filters: ${{ steps.plan.outputs.js_typecheck_filters }}
      run_devfn: ${{ steps.plan.outputs.run_devfn }}
      devfn_test_filters: ${{ steps.plan.outputs.devfn_test_filters }}
      run_python: ${{ steps.plan.outputs.run_python }}
      full_python: ${{ steps.plan.outputs.full_python }}
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
      run_mcpfn: ${{ steps.plan.outputs.run_mcpfn }}
      mcpfn_only: ${{ steps.plan.outputs.mcpfn_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Refresh common target branches
        run: |
          git fetch --no-tags --depth=1 origin dev || true
          git fetch --no-tags --depth=1 origin next || true
          git fetch --no-tags --depth=1 origin main || true

      - name: Verify CI planner
        run: node --test scripts/ci-plan.test.mjs

      - name: Verify workflow action pins
        run: node --test scripts/workflow-pins.test.mjs

      # The standalone-script list (SFNS-307) must match turbo.json's global inputs and no package may use a script on
      # it. These checks need no Turbo, so every pull request runs them, whatever the plan selects. The file's Turbo
      # task-hash tests need an installed Turbo and run with `node --test scripts/turbo-cache-config.test.mjs`.
      - name: Verify standalone script list
        run: |
          node --test --test-name-pattern="^standalone list: " scripts/turbo-cache-config.test.mjs

      - name: Verify Turbo cache merge
        run: node --test scripts/turbo-cache-merge.test.mjs

      # Every file a cacheable Turbo task reads from outside its package must be in that task's Turbo hash (SFNS-311).
      # The guard asks Turbo, and this job installs no workspace dependencies, so it installs only the locked Turbo.
      - name: Install Turbo
        run: |
          turbo_version="$(node -p "require('./package-lock.json').packages['node_modules/turbo'].version")"
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/turbo" "turbo@${turbo_version}"
          echo "TURBO_BIN=$RUNNER_TEMP/turbo/node_modules/turbo/bin/turbo" >> "$GITHUB_ENV"

      - name: Verify Turbo task inputs
        run: |
          node --test scripts/turbo-inputs-guard.test.mjs
          node scripts/turbo-inputs-guard.mjs

      - name: Verify UIFn docs CLI resolution
        run: node --test scripts/uifn-docs-cli-resolution.test.mjs

      - name: Verify UIFn registry KMS signer
        run: node --test scripts/sign-uifn-registry-kms.test.mjs

      - name: Nested package-lock.json files are not tracked
        run: |
          node --test scripts/verify-package-lockfiles.test.mjs
          node scripts/verify-package-lockfiles.mjs

      # Ownership manifests (SFNS-122) with public semantics: superfunctions.owners.json must list every top-level path,
      # root file, release slug and Python project, and every workflow outside the shared list carries the repository
      # guard (SFNS-123). This job is guarded, so it never runs on 21nCo/super-functions.next; next runs
      # `node scripts/verify-owners.mjs --repo next` from its own CI (live next check deferred to SFNS-160).
      - name: Ownership manifest matches the tree
        env:
          OWNERS_REPO: public
        run: |
          node --test scripts/owners.test.mjs scripts/verify-owners.test.mjs
          node scripts/verify-owners.mjs --repo "$OWNERS_REPO"

      # The dev-push notifier (SFNS-126): trigger, repository guard, environment, token permissions and payload.
      - name: Verify next sync notifier workflow
        run: node --test scripts/notify-next-sync-workflow.test.mjs

      # Pull requests build, typecheck and test only the packages they change plus their dependents; pushes to
      # dev/next/main (which the release CI gate reads), the nightly run and manual runs plan every job.
      - name: Build CI plan
        id: plan
        env:
          CI_PLAN_MODE: ${{ github.event_name == 'pull_request' && 'affected' || 'full' }}
        run: node scripts/ci-plan.mjs

  # uifn-version-bump-retarget.yml reruns this job when a PR is edited, which is how a PR retargeted to dev gets it.
  uifn-version-bump:
    name: UIFn version bump
    if: github.repository == '21nCo/superfunctions' && (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      # The PR merge ref, which holds the checker even for a branch made before it, with every branch's history.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Payload base.sha is stale after a push and the merge ref can predate the base tip, so judge a merge of exactly the base tip B and head.sha.
      - name: Merge the PR head into the base branch tip
        run: |
          B=$(git rev-parse "origin/${{ github.base_ref }}") H="${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" "$B" || { echo "::error::base ${{ github.event.pull_request.base.sha }} is not on ${{ github.base_ref }} at $B"; exit 1; }
          if [ "$(git rev-parse HEAD^1 HEAD^2 | tr '\n' ' ')" != "$B $H " ]; then
            git checkout -q --detach "$B" && git -c user.name=ci -c user.email=ci@localhost merge -q --no-ff --no-edit "$H" || { echo "::error::cannot merge head $H into ${{ github.base_ref }} at $B"; exit 1; }
          fi
          echo "UIFN_BASE=$B" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      # The checker resolves tsconfigs with the repository's TypeScript.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify version bump checker
        run: node --test scripts/verify-uifn-version-bump.test.mjs

      - name: Require version bump and changelog entry for shipped uifn changes
        run: node scripts/verify-uifn-version-bump.mjs --base "$UIFN_BASE"

      - name: Report uifn changes since last published tags
        run: node scripts/verify-uifn-version-bump.mjs --since-published --head "$UIFN_BASE"

  javascript:
    name: JavaScript
    needs: plan
    if: github.repository == '21nCo/superfunctions' && (needs.plan.outputs.run_js == 'true' && needs.plan.outputs.mcpfn_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Build trusted SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Show plan
        run: |
          echo "mode: ${{ needs.plan.outputs.plan_mode }}"
          echo "base: ${{ needs.plan.outputs.base_ref }}"
          echo "changed files: ${{ needs.plan.outputs.changed_files_count }}"
          echo "full js: ${{ needs.plan.outputs.full_js }}"
          echo "build filters: ${{ needs.plan.outputs.js_build_filters }}"
          echo "test filters: ${{ needs.plan.outputs.js_test_filters }}"
          echo "lint filters: ${{ needs.plan.outputs.js_lint_filters }}"
          echo "typecheck filters: ${{ needs.plan.outputs.js_typecheck_filters }}"
          echo "devfn tests (DevFn tests job): ${{ needs.plan.outputs.devfn_test_filters }}"

      # Turbo's task cache (SFNS-312, scripts/turbo-cache-merge.mjs). Every run records the current task hashes and a
      # baseline before any task runs, and each Turbo step runs with --summarize and records its summary, the cache
      # files and the changed or untracked files. Before saving, the merge deletes each entry written by a step that
      # changed a file outside its tasks' declared outputs (a replay would not restore that file) or that left no
      # record, and reports those files as warnings. The cache bookkeeping never changes a job's result: recording the
      # hashes, merging and saving continue on error, and a run whose record or merge failed saves nothing. The one
      # fatal cache step is a run that cannot set its restored entries aside, since it must not replay them. A pull
      # request replays each task whose Turbo inputs are unchanged, prunes the restored entries whose hash is not
      # current and saves its entry even when a task failed. Every other run (a push, the nightly run, a manual run)
      # replays nothing, because the release CI gate needs every task run on the release commit: it sets the restored
      # entries aside, runs every selected task while Turbo writes the cache, then merges back the set-aside entries for
      # current hashes the run did not rewrite, so the entry it saves, which pull requests restore, holds every task and
      # not only those the run selected. It saves only when every step passed, so a failed run leaves the last complete
      # entry in place. `--cache=local:w` is not used for this: each step would then rebuild every `^build` instead of
      # reading the Build step's results. The Node major and the job are in the key, so another Node version or job
      # never reuses an entry.
      - name: Turbo cache key
        id: turbo-cache-key
        run: echo "prefix=turbo-${RUNNER_OS}-node$(node -p 'process.versions.node.split(".")[0]')-${GITHUB_JOB}" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        id: turbo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache-key.outputs.prefix }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.turbo-cache-key.outputs.prefix }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-
            ${{ steps.turbo-cache-key.outputs.prefix }}-${{ hashFiles('package-lock.json') }}-
            ${{ steps.turbo-cache-key.outputs.prefix }}-

      - name: Set the restored Turbo cache aside
        if: github.event_name != 'pull_request'
        run: |
          if [ -d .turbo/cache ]; then
            mv .turbo/cache "$RUNNER_TEMP/turbo-cache-aside"
          fi

      - name: Record the Turbo task hashes and the restored cache
        id: turbo-cache-prepare
        continue-on-error: true
        run: |
          ./node_modules/.bin/turbo run build typecheck test lint --dry=json > "$RUNNER_TEMP/turbo-dry-run.json"
          node scripts/turbo-cache-merge.mjs --record prepare --baseline --steps-dir "$RUNNER_TEMP/turbo-steps"

      - name: Build
        if: needs.plan.outputs.has_js_build == 'true'
        run: |
          status=0
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run build --summarize || status=$?
          else
            ./node_modules/.bin/turbo run build --summarize ${{ needs.plan.outputs.js_build_filters }} || status=$?
          fi
          node scripts/turbo-cache-merge.mjs --record build --steps-dir "$RUNNER_TEMP/turbo-steps" || true
          exit "$status"

      - name: Typecheck
        if: needs.plan.outputs.has_js_typecheck == 'true'
        run: |
          status=0
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run typecheck --summarize || status=$?
          else
            ./node_modules/.bin/turbo run typecheck --summarize ${{ needs.plan.outputs.js_typecheck_filters }} || status=$?
          fi
          node scripts/turbo-cache-merge.mjs --record typecheck --steps-dir "$RUNNER_TEMP/turbo-steps" || true
          exit "$status"

      # Avoid oversubscribing hosted runners with many concurrent Vitest pools. The filters exclude every DevFn
      # package, even on a full run: the DevFn tests job runs those.
      - name: Test
        if: needs.plan.outputs.has_js_test == 'true'
        run: |
          status=0
          ./node_modules/.bin/turbo run test --concurrency=2 --summarize ${{ needs.plan.outputs.js_test_filters }} || status=$?
          node scripts/turbo-cache-merge.mjs --record test --steps-dir "$RUNNER_TEMP/turbo-steps" || true
          exit "$status"

      - name: Lint
        if: needs.plan.outputs.has_js_lint == 'true'
        run: |
          status=0
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run lint --summarize || status=$?
          else
            ./node_modules/.bin/turbo run lint --summarize ${{ needs.plan.outputs.js_lint_filters }} || status=$?
          fi
          node scripts/turbo-cache-merge.mjs --record lint --steps-dir "$RUNNER_TEMP/turbo-steps" || true
          exit "$status"

      - name: Merge and prune the Turbo cache
        id: turbo-cache-merge
        continue-on-error: true
        if: >-
          ${{ steps.turbo-cache-prepare.outcome == 'success' &&
          (success() || (github.event_name == 'pull_request' && !cancelled())) }}
        run: |
          aside=()
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            aside=(--aside-dir "$RUNNER_TEMP/turbo-cache-aside")
          fi
          node scripts/turbo-cache-merge.mjs --merge --steps-dir "$RUNNER_TEMP/turbo-steps" --cache-dir .turbo/cache \
            --dry-run "$RUNNER_TEMP/turbo-dry-run.json" "${aside[@]}"

      - name: Save Turbo cache
        continue-on-error: true
        if: >-
          ${{ !cancelled() && steps.turbo-cache-merge.outcome == 'success' &&
          steps.turbo-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache-restore.outputs.cache-primary-key }}

  # DevFn's real-process tests (SFNS-293) run one package at a time, apart from every other package's tests. The plan
  # selects the DevFn part of the JavaScript test selection: a full run selects every DevFn package. Like the JavaScript
  # job it skips McpFn-only changes. Build and typecheck of DevFn packages stay in the JavaScript job.
  devfn:
    name: DevFn tests
    needs: plan
    if: github.repository == '21nCo/superfunctions' && (needs.plan.outputs.run_devfn == 'true' && needs.plan.outputs.mcpfn_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Build trusted SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Show plan
        run: |
          echo "base: ${{ needs.plan.outputs.base_ref }}"
          echo "full js: ${{ needs.plan.outputs.full_js }}"
          echo "devfn test filters: ${{ needs.plan.outputs.devfn_test_filters }}"

      # Turbo's task cache, as in the JavaScript job (SFNS-312). DevFn's own tasks are uncacheable (turbo.json).
      - name: Turbo cache key
        id: turbo-cache-key
        run: echo "prefix=turbo-${RUNNER_OS}-node$(node -p 'process.versions.node.split(".")[0]')-${GITHUB_JOB}" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        id: turbo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache-key.outputs.prefix }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.turbo-cache-key.outputs.prefix }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-
            ${{ steps.turbo-cache-key.outputs.prefix }}-${{ hashFiles('package-lock.json') }}-
            ${{ steps.turbo-cache-key.outputs.prefix }}-

      - name: Set the restored Turbo cache aside
        if: github.event_name != 'pull_request'
        run: |
          if [ -d .turbo/cache ]; then
            mv .turbo/cache "$RUNNER_TEMP/turbo-cache-aside"
          fi

      - name: Record the Turbo task hashes and the restored cache
        id: turbo-cache-prepare
        continue-on-error: true
        run: |
          ./node_modules/.bin/turbo run test --dry=json > "$RUNNER_TEMP/turbo-dry-run.json"
          node scripts/turbo-cache-merge.mjs --record prepare --baseline --steps-dir "$RUNNER_TEMP/turbo-steps"

      - name: Test
        run: |
          status=0
          ./node_modules/.bin/turbo run test --concurrency=1 --summarize ${{ needs.plan.outputs.devfn_test_filters }} || status=$?
          node scripts/turbo-cache-merge.mjs --record test --steps-dir "$RUNNER_TEMP/turbo-steps" || true
          exit "$status"

      - name: Merge and prune the Turbo cache
        id: turbo-cache-merge
        continue-on-error: true
        if: >-
          ${{ steps.turbo-cache-prepare.outcome == 'success' &&
          (success() || (github.event_name == 'pull_request' && !cancelled())) }}
        run: |
          aside=()
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            aside=(--aside-dir "$RUNNER_TEMP/turbo-cache-aside")
          fi
          node scripts/turbo-cache-merge.mjs --merge --steps-dir "$RUNNER_TEMP/turbo-steps" --cache-dir .turbo/cache \
            --dry-run "$RUNNER_TEMP/turbo-dry-run.json" "${aside[@]}"

      - name: Save Turbo cache
        continue-on-error: true
        if: >-
          ${{ !cancelled() && steps.turbo-cache-merge.outcome == 'success' &&
          steps.turbo-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache-restore.outputs.cache-primary-key }}

  mcpfn-node20:
    name: McpFn Node 20 compatibility
    needs: plan
    if: github.repository == '21nCo/superfunctions' && (needs.plan.outputs.run_mcpfn == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Only the build tool needs its installation hook in this compatibility lane.
      - name: Build trusted esbuild binary
        run: npm rebuild esbuild

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Build compatibility targets and dependencies
        run: ./node_modules/.bin/turbo run build --filter='@mcpfn/testing...' --filter='@mcpfn/cli...'

      - name: Check transport-neutral client, testing, and CLI on Node 20
        run: |
          npm run typecheck --workspace=@mcpfn/client --workspace=@mcpfn/testing --workspace=@mcpfn/cli
          npm test --workspace=@mcpfn/client --workspace=@mcpfn/testing --workspace=@mcpfn/cli

  # Leak guard (SFNS-125): the public tree holds only what superfunctions.owners.json allows (top-level paths,
  # release entries, Python projects, workspace packages) and imports or depends on no *fn package that is neither a
  # public workspace package nor pinned in scripts/public-boundary.allow.json. Guarded, so it never runs on next.
  public-boundary:
    name: Public boundary
    if: github.repository == '21nCo/superfunctions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      # Imports are read with the installed parsers (typescript, svelte, parse5, MDX) and Python's ast module.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify public boundary checker
        run: node --test scripts/verify-public-boundary.test.mjs

      - name: Public tree stays inside the public manifest
        run: node scripts/verify-public-boundary.mjs

  # Release target resolution (release-packages.json plus a repository overlay) on the runtimes the publish
  # workflows use, and the root workspace globs against the explicit list they replaced (SFNS-123). The promotion
  # script's temp-repository tests need git-filter-repo; PROMOTE_REQUIRE_FILTER_REPO turns their skip into a failure.
  release-scripts:
    name: Release scripts
    if: github.repository == '21nCo/superfunctions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Workspace globs and npm release targets
        run: node --test scripts/workspaces.test.mjs scripts/resolve-release-tag.test.mjs

      - name: Release owner and CI gates (SFNS-124)
        run: node --test scripts/assert-release-owner.test.mjs scripts/assert-release-ci.test.mjs scripts/release-gate-workflows.test.mjs

      - name: Python release targets
        run: |
          python -m pip install --only-binary=:all: packaging==25.0
          python -m unittest discover -s scripts -p test_python_release.py -v

      - name: Promotion script (SFNS-127)
        run: |
          python -m pip install --only-binary=:all: git-filter-repo==2.47.0
          git filter-repo --version
          PROMOTE_REQUIRE_FILTER_REPO=1 node --test scripts/promote.test.mjs

  python:
    name: Python package (${{ matrix.package.path }})
    needs: plan
    if: github.repository == '21nCo/superfunctions' && (needs.plan.outputs.run_python == 'true' && needs.plan.outputs.mcpfn_only != 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.python_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Upgrade pip
        run: "python -m pip install --only-binary=:all: pip==26.0.1 build==1.4.4"

      - name: Check package
        run: node scripts/ci-run-python-package.mjs "${{ matrix.package.path }}"

  python-result:
    name: Python
    needs: [plan, python]
    if: github.repository == '21nCo/superfunctions' && (always())
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned Python package check to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
        run: |
          echo "plan: ${PLAN_RESULT}, python packages: ${PYTHON_RESULT}"
          if [ "${PLAN_RESULT}" != "success" ]; then
            echo "The CI plan did not succeed." >&2
            exit 1
          fi
          case "${PYTHON_RESULT}" in
            success|skipped) ;;
            *)
              echo "A Python package check ended ${PYTHON_RESULT}." >&2
              exit 1
              ;;
          esac

  mcpfn:
    name: McpFn release gate
    needs: plan
    if: github.repository == '21nCo/superfunctions' && (needs.plan.outputs.run_mcpfn == 'true')
    runs-on: ubuntu-24.04 # Playwright 1.59 does not support ubuntu-latest (26.04)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Build trusted SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Install Chromium for McpFn auth tests
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run McpFn release gate
        run: npm run gate:mcpfn-release
        env:
          MCPFN_ARTIFACT_DIR: artifacts/mcpfn

      - name: Upload McpFn regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpfn-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mcpfn
          if-no-files-found: warn
          retention-days: 14

  mcpfn-node18-cjs:
    name: McpFn Node 18 CommonJS
    needs: plan
    if: github.repository == '21nCo/superfunctions' && (needs.plan.outputs.run_mcpfn == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18.20.8"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Build CommonJS dependency chain
        run: |
          npm run build --workspace @superfunctions/observability
          npm run build --workspace @superfunctions/db
          npm run build --workspace @superfunctions/oauth-storage
          npm run build --workspace @superfunctions/oauth-core
          npm run build --workspace @mcpfn/core
          npm run build --workspace @mcpfn/client

      - name: Require supported CommonJS entry points
        run: node -e 'for (const name of ["@superfunctions/oauth-core", "@mcpfn/core", "@mcpfn/client"]) { const loaded = require(name); if (!Object.keys(loaded).length) throw new Error(name + " has no CommonJS exports"); }'
