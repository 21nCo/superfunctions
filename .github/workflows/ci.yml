name: CI

on:
  push:
    branches:
      - dev
      - next
      - main
  pull_request:
    branches:
      - dev
      - next
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      base_ref: ${{ steps.plan.outputs.base_ref }}
      changed_files_count: ${{ steps.plan.outputs.changed_files_count }}
      run_js: ${{ steps.plan.outputs.run_js }}
      full_js: ${{ steps.plan.outputs.full_js }}
      has_js_build: ${{ steps.plan.outputs.has_js_build }}
      has_js_test: ${{ steps.plan.outputs.has_js_test }}
      has_js_lint: ${{ steps.plan.outputs.has_js_lint }}
      has_js_typecheck: ${{ steps.plan.outputs.has_js_typecheck }}
      js_build_filters: ${{ steps.plan.outputs.js_build_filters }}
      js_test_filters: ${{ steps.plan.outputs.js_test_filters }}
      js_lint_filters: ${{ steps.plan.outputs.js_lint_filters }}
      js_typecheck_filters: ${{ steps.plan.outputs.js_typecheck_filters }}
      run_python: ${{ steps.plan.outputs.run_python }}
      full_python: ${{ steps.plan.outputs.full_python }}
      python_matrix: ${{ steps.plan.outputs.python_matrix }}
      run_mcpfn: ${{ steps.plan.outputs.run_mcpfn }}
      mcpfn_only: ${{ steps.plan.outputs.mcpfn_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh common target branches
        run: |
          git fetch --no-tags --depth=1 origin dev || true
          git fetch --no-tags --depth=1 origin next || true
          git fetch --no-tags --depth=1 origin main || true

      - name: Verify CI planner
        run: node --test scripts/ci-plan.test.mjs

      - name: Verify UIFn docs CLI resolution
        run: node --test scripts/uifn-docs-cli-resolution.test.mjs

      - name: Nested package-lock.json files are not tracked
        run: |
          node --test scripts/verify-package-lockfiles.test.mjs
          node scripts/verify-package-lockfiles.mjs

      - name: Build CI plan
        id: plan
        run: node scripts/ci-plan.mjs

  # uifn-version-bump-retarget.yml reruns this job when a PR is edited, which is how a PR retargeted to dev gets it.
  uifn-version-bump:
    name: UIFn version bump
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      # The PR merge ref, which holds the checker even for a branch made before it, with every branch's history.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Payload base.sha is stale after a push and the merge ref can predate the base tip, so judge a merge of exactly the base tip B and head.sha.
      - name: Merge the PR head into the base branch tip
        run: |
          B=$(git rev-parse "origin/${{ github.base_ref }}") H="${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" "$B" || { echo "::error::base ${{ github.event.pull_request.base.sha }} is not on ${{ github.base_ref }} at $B"; exit 1; }
          if [ "$(git rev-parse HEAD^1 HEAD^2 | tr '\n' ' ')" != "$B $H " ]; then
            git checkout -q --detach "$B" && git -c user.name=ci -c user.email=ci@localhost merge -q --no-ff --no-edit "$H" || { echo "::error::cannot merge head $H into ${{ github.base_ref }} at $B"; exit 1; }
          fi
          echo "UIFN_BASE=$B" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      # The checker resolves tsconfigs with the repository's TypeScript.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify version bump checker
        run: node --test scripts/verify-uifn-version-bump.test.mjs

      - name: Require version bump and changelog entry for shipped uifn changes
        run: node scripts/verify-uifn-version-bump.mjs --base "$UIFN_BASE"

      - name: Report uifn changes since last published tags
        run: node scripts/verify-uifn-version-bump.mjs --since-published --head "$UIFN_BASE"

  javascript:
    name: JavaScript
    needs: plan
    if: needs.plan.outputs.run_js == 'true' && needs.plan.outputs.mcpfn_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Build trusted SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Show plan
        run: |
          echo "base: ${{ needs.plan.outputs.base_ref }}"
          echo "changed files: ${{ needs.plan.outputs.changed_files_count }}"
          echo "full js: ${{ needs.plan.outputs.full_js }}"
          echo "build filters: ${{ needs.plan.outputs.js_build_filters }}"
          echo "test filters: ${{ needs.plan.outputs.js_test_filters }}"
          echo "lint filters: ${{ needs.plan.outputs.js_lint_filters }}"
          echo "typecheck filters: ${{ needs.plan.outputs.js_typecheck_filters }}"

      - name: Build
        if: needs.plan.outputs.has_js_build == 'true'
        run: |
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run build
          else
            ./node_modules/.bin/turbo run build ${{ needs.plan.outputs.js_build_filters }}
          fi

      - name: Typecheck
        if: needs.plan.outputs.has_js_typecheck == 'true'
        run: |
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run typecheck
          else
            ./node_modules/.bin/turbo run typecheck ${{ needs.plan.outputs.js_typecheck_filters }}
          fi

      # Avoid oversubscribing hosted runners with many concurrent Vitest pools.
      - name: Test
        if: needs.plan.outputs.has_js_test == 'true'
        run: |
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run test --concurrency=2
          else
            ./node_modules/.bin/turbo run test --concurrency=2 ${{ needs.plan.outputs.js_test_filters }}
          fi

      - name: Lint
        if: needs.plan.outputs.has_js_lint == 'true'
        run: |
          if [ "${{ needs.plan.outputs.full_js }}" = "true" ]; then
            ./node_modules/.bin/turbo run lint
          else
            ./node_modules/.bin/turbo run lint ${{ needs.plan.outputs.js_lint_filters }}
          fi

  mcpfn-node20:
    name: McpFn Node 20 compatibility
    needs: plan
    if: needs.plan.outputs.run_mcpfn == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Only the build tool needs its installation hook in this compatibility lane.
      - name: Build trusted esbuild binary
        run: npm rebuild esbuild

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Build compatibility targets and dependencies
        run: ./node_modules/.bin/turbo run build --filter='@mcpfn/testing...' --filter='@mcpfn/cli...'

      - name: Check transport-neutral client, testing, and CLI on Node 20
        run: |
          npm run typecheck --workspace=@mcpfn/client --workspace=@mcpfn/testing --workspace=@mcpfn/cli
          npm test --workspace=@mcpfn/client --workspace=@mcpfn/testing --workspace=@mcpfn/cli

  python:
    name: Python
    needs: plan
    if: needs.plan.outputs.run_python == 'true' && needs.plan.outputs.mcpfn_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.plan.outputs.python_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            **/pyproject.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upgrade pip
        run: "python -m pip install --only-binary=:all: pip==26.0.1 build==1.4.4"

      - name: Check package
        run: node scripts/ci-run-python-package.mjs "${{ matrix.package.path }}"

  mcpfn:
    name: McpFn release gate
    needs: plan
    if: needs.plan.outputs.run_mcpfn == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.59 does not support ubuntu-latest (26.04)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Build trusted SQLite native binding
        run: npm rebuild better-sqlite3

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Install Chromium for McpFn auth tests
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run McpFn release gate
        run: npm run gate:mcpfn-release
        env:
          MCPFN_ARTIFACT_DIR: artifacts/mcpfn

      - name: Upload McpFn regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcpfn-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mcpfn
          if-no-files-found: warn
          retention-days: 14

  mcpfn-node18-cjs:
    name: McpFn Node 18 CommonJS
    needs: plan
    if: needs.plan.outputs.run_mcpfn == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted esbuild native binding
        run: npm rebuild esbuild

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Build CommonJS dependency chain
        run: |
          npm run build --workspace @superfunctions/observability
          npm run build --workspace @superfunctions/db
          npm run build --workspace @superfunctions/oauth-storage
          npm run build --workspace @superfunctions/oauth-core
          npm run build --workspace @mcpfn/core
          npm run build --workspace @mcpfn/client

      - name: Require supported CommonJS entry points
        run: node -e 'for (const name of ["@superfunctions/oauth-core", "@mcpfn/core", "@mcpfn/client"]) { const loaded = require(name); if (!Object.keys(loaded).length) throw new Error(name + " has no CommonJS exports"); }'
