name: DataFn Postgres Integration

# DATA-41: per-record revisions under truly concurrent PostgreSQL sessions
# (overlapping writers and deletes at READ COMMITTED, clone and
# versioned-query snapshots).
# PGlite has one session, so these suites need a PostgreSQL server.

on:
  push:
    branches: [dev, next, main]
    paths:
      - "datafn/server/**"
      - "datafn/core/**"
      - "packages/db/**"
      - "package-lock.json"
      - ".github/workflows/datafn-postgres.yml"
  pull_request:
    branches: [dev, next, main]
    paths:
      - "datafn/server/**"
      - "datafn/core/**"
      - "packages/db/**"
      - "package-lock.json"
      - ".github/workflows/datafn-postgres.yml"

permissions:
  contents: read

concurrency:
  group: datafn-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: DataFn revisions tests with a Postgres server
    if: github.repository == '21nCo/superfunctions'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datafn
          # Generated per run; never a committed literal.
          POSTGRES_PASSWORD: ${{ format('datafn-ci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: datafn_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U datafn -d datafn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build trusted native bindings
        run: npm rebuild esbuild better-sqlite3

      - name: Ensure Rollup native package
        run: node scripts/ci-install-rollup-native.mjs

      - name: Build the DataFn server's workspace dependencies
        run: ./node_modules/.bin/turbo run build --filter=@datafn/server^... --concurrency=2

      # node-postgres reads the user and password from PGUSER and PGPASSWORD.
      # DATAFN_TEST_POSTGRES_REQUIRED makes a missing server URL fail the
      # suite instead of skipping it.
      - name: Run the revisions suites against Postgres 16
        working-directory: datafn/server
        env:
          PGUSER: datafn
          PGPASSWORD: ${{ format('datafn-ci-{0}-{1}', github.run_id, github.run_attempt) }}
          DATAFN_TEST_POSTGRES_URL: postgres://localhost:5434/datafn_test
          DATAFN_TEST_POSTGRES_REQUIRED: "1"
        run: >-
          npx vitest run --maxWorkers=2 --minWorkers=1
          __tests__/revisions-postgres-writes.test.ts
          __tests__/revisions-postgres-server.test.ts
          __tests__/revisions-postgres.test.ts
