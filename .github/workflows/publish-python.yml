name: Publish tagged Python library

on:
  push:
    tags:
      - 'python-*-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Immutable python-<project>-v<PEP440-version> tag'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  # Production consumers resolve real published prerequisites, never local wheels.
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_FIND_LINKS: ''
  PIP_NO_INDEX: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    # actions and checks: read let the release CI gate read the CI result of the tag commit.
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      release_commit: ${{ steps.source.outputs.release_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require immutable tag
        id: source
        run: node scripts/assert-release-ref.mjs "${RELEASE_TAG}"
      # SFNS-124: only the repository that owns the Python project publishes it, and only a commit that passed CI;
      # both run before anything is installed, built or packed. Both gates run from this run's own commit, because a
      # dispatch may name a tag made before the gates existed, and read the tag checkout's manifests and CI.
      - name: Require this repository to own the release
        shell: bash
        run: |
          set -euo pipefail
          gates="${RUNNER_TEMP}/release-gates"
          # The dispatching branch may have moved or been deleted since dispatch; fetch its commit by SHA if needed.
          git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git worktree add --detach "${gates}" "${GITHUB_SHA}"
          node "${gates}/scripts/assert-release-owner.mjs" python "${RELEASE_TAG}" --root "${GITHUB_WORKSPACE}"
      - name: Require successful CI on the release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "${RUNNER_TEMP}/release-gates/scripts/assert-release-ci.mjs" "${{ steps.source.outputs.release_commit }}" --root "${GITHUB_WORKSPACE}"
      - name: Install release tools
        run: python -m pip install build twine packaging
      - name: Resolve exact package and version
        run: python scripts/python_release.py resolve "${RELEASE_TAG}"
      - name: Reject occupied or regressive PyPI version
        run: python scripts/python_release.py check-registry "${RELEASE_TAG}"
      - name: Build sdist and wheel, check metadata and test installed library
        id: build
        run: python scripts/python_release.py build "${RELEASE_TAG}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: ${{ steps.build.outputs.artifact_dir }}/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILT_COMMIT: ${{ needs.build.outputs.release_commit }}
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Recheck immutable tag and exact artifact identity
        run: |
          node scripts/assert-release-ref.mjs "${RELEASE_TAG}" "${BUILT_COMMIT}"
          python -m pip install packaging twine
          python scripts/python_release.py check-registry "${RELEASE_TAG}"
          python scripts/python_release.py verify "${RELEASE_TAG}" --out-dir dist
          python -m twine check --strict dist/*
      - name: Publish exact validated distributions through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
