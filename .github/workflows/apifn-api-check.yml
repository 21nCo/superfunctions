name: ApiFn API Check

on:
  workflow_call:
    inputs:
      spec_path:
        description: Committed OpenAPI spec. Required without router_path (repo-relative); with router_path it is passed as --spec, relative to working_directory (empty uses the apifn config's default)
        required: false
        default: ""
        type: string
      router_path:
        description: Router module, relative to working_directory. Set it to run apifn check (drift, validation, breaking changes against the base) instead of validate-and-diff
        required: false
        default: ""
        type: string
      config_path:
        description: apifn config file for apifn check, relative to working_directory (empty finds apifn.config.ts, .js or .mjs there)
        required: false
        default: ""
        type: string
      base_spec:
        description: With router_path, a base spec file (relative to working_directory) or HTTP(S) URL used instead of the spec committed at origin/<base_branch>
        required: false
        default: ""
        type: string
      allow_breaking:
        description: "With router_path, report breaking changes the contract version does not cover without failing (apifn check --allow-breaking, verdict warn). Only this input allows them; diff.failOnBreaking false in the caller's apifn config does not"
        required: false
        default: false
        type: boolean
      working_directory:
        description: Directory of the caller's package, repo-relative. With router_path, npm ci and apifn check run there
        required: false
        default: "."
        type: string
      cli_source:
        description: "npm (the lockfile install pinned by this workflow revision) or workspace (build @apifn/cli from the checked-out repository; 21nCo/superfunctions only)"
        required: false
        default: npm
        type: string
      enforce_gates:
        description: Fail the job when a gate fails. false only reports (summary, comment and outputs still carry the result); keep the default for a required check
        required: false
        default: true
        type: boolean
      collection_dir:
        description: OpenCollection directory (repo-relative). Empty skips the collection tests, reported as not run
        required: false
        default: ""
        type: string
      environment:
        description: Collection environment name
        required: false
        default: development
        type: string
      cli_version:
        description: Must match the @apifn/cli version pinned by this workflow revision; the default matches
        required: false
        default: "0.1.2"
        type: string
      start_mock_server:
        description: Start apifn mock on spec_path (relative to working_directory with router_path) for workflow self-tests before running the collection
        required: false
        default: false
        type: boolean
      mock_port:
        description: Port used when start_mock_server is enabled
        required: false
        default: 19999
        type: number
      base_branch:
        description: Base branch for spec diff (a branch name, not a revision)
        required: false
        default: main
        type: string
      fail_on_breaking:
        description: Fail the workflow when breaking changes are found
        required: false
        default: true
        type: boolean
      post_pr_comment:
        description: Post/update PR summary comment
        required: false
        default: true
        type: boolean
      called_as_reusable_workflow:
        description: Leave at its default; marks a workflow_call run (workflow_dispatch does not declare it), see the api-check job's if
        required: false
        default: true
        type: boolean
    outputs:
      verdict:
        description: "pass, warn or fail: the result of every gate (warn only with router_path)"
        value: ${{ jobs.api-check.outputs.verdict }}
      drift:
        description: "true when the committed spec differs from the router (router_path only; empty otherwise or when apifn check produced no consistent report)"
        value: ${{ jobs.api-check.outputs.drift }}
      breaking:
        description: "true when the diff against the base found breaking changes, allowed or not (empty when no consistent report was produced)"
        value: ${{ jobs.api-check.outputs.breaking }}
  workflow_dispatch:
    inputs:
      spec_path:
        description: Committed OpenAPI spec. Required without router_path (repo-relative); with router_path it is passed as --spec, relative to working_directory (empty uses the apifn config's default)
        required: false
        default: ""
        type: string
      router_path:
        description: Router module, relative to working_directory. Set it to run apifn check (drift, validation, breaking changes against the base) instead of validate-and-diff
        required: false
        default: ""
        type: string
      config_path:
        description: apifn config file for apifn check, relative to working_directory (empty finds apifn.config.ts, .js or .mjs there)
        required: false
        default: ""
        type: string
      base_spec:
        description: With router_path, a base spec file (relative to working_directory) or HTTP(S) URL used instead of the spec committed at origin/<base_branch>
        required: false
        default: ""
        type: string
      allow_breaking:
        description: "With router_path, report breaking changes the contract version does not cover without failing (apifn check --allow-breaking, verdict warn). Only this input allows them; diff.failOnBreaking false in the caller's apifn config does not"
        required: false
        default: false
        type: boolean
      working_directory:
        description: Directory of the caller's package, repo-relative. With router_path, npm ci and apifn check run there
        required: false
        default: "."
        type: string
      cli_source:
        description: "npm (the lockfile install pinned by this workflow revision) or workspace (build @apifn/cli from the checked-out repository; 21nCo/superfunctions only)"
        required: false
        default: npm
        type: string
      enforce_gates:
        description: Fail the job when a gate fails. false only reports (summary, comment and outputs still carry the result); keep the default for a required check
        required: false
        default: true
        type: boolean
      collection_dir:
        description: OpenCollection directory (repo-relative). Empty skips the collection tests, reported as not run
        required: false
        default: ""
        type: string
      environment:
        description: Collection environment name
        required: false
        default: development
        type: string
      cli_version:
        description: Must match the @apifn/cli version pinned by this workflow revision; the default matches
        required: false
        default: "0.1.2"
        type: string
      start_mock_server:
        description: Start apifn mock on spec_path (relative to working_directory with router_path) for workflow self-tests before running the collection
        required: false
        default: false
        type: boolean
      mock_port:
        description: Port used when start_mock_server is enabled
        required: false
        default: 19999
        type: number
      base_branch:
        description: Base branch for spec diff (a branch name, not a revision)
        required: false
        default: main
        type: string
      fail_on_breaking:
        description: Fail the workflow when breaking changes are found
        required: false
        default: true
        type: boolean
      post_pr_comment:
        description: Post/update PR summary comment
        required: false
        default: true
        type: boolean

# Callers must grant at least these scopes. A reusable workflow cannot
# elevate GITHUB_TOKEN; a caller with pull-requests: read causes
# startup_failure before any job runs. Each job narrows them: evaluate
# (the caller's code) gets contents: read, api-check pull-requests: write.
permissions:
  contents: read
  pull-requests: write

jobs:
  # Runs the caller's code (npm ci lifecycle scripts, the workspace build, the router and config imports) with a
  # read-only token. The api-check job below posts the comment and applies the gates; only it can write to the pull
  # request, and it checks out, installs and imports nothing.
  # Every step that can fail continues on error and the later steps run only while none failed (steps.*.outcome), so
  # a failed step still reaches the summary and the gate decision, and the api-check job (which runs only after this
  # job succeeds: scripts/verify-owners.mjs allows no status function in these jobs' if) reports it. Step timeouts stay
  # below the job's, so a hung install or router import fails its step rather than the job.
  evaluate:
    # A called workflow sees its caller's github context (repository, event_name, workflow_ref), so only its own inputs
    # tell a call from a direct run: called_as_reusable_workflow defaults to true under workflow_call and is not declared
    # under workflow_dispatch. Every caller, including external repositories (apifn/README.md), runs these jobs; a direct
    # workflow_dispatch run skips outside 21nCo/superfunctions (SFNS-121 D14, checked by scripts/verify-owners.mjs).
    if: github.repository == '21nCo/superfunctions' || inputs.called_as_reusable_workflow == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.result.outputs.verdict }}
      drift: ${{ steps.result.outputs.drift }}
      breaking: ${{ steps.result.outputs.breaking }}
      comment: ${{ steps.result.outputs.comment }}
      gate_code: ${{ steps.gates.outputs.code }}

    steps:
      - name: Check inputs
        id: inputs
        continue-on-error: true
        shell: bash
        env:
          CLI_SOURCE: ${{ inputs.cli_source }}
          CALLER_REPOSITORY: ${{ github.repository }}
          ROUTER_PATH: ${{ inputs.router_path }}
          SPEC_PATH: ${{ inputs.spec_path }}
          BASE_SPEC: ${{ inputs.base_spec }}
          CONFIG_PATH: ${{ inputs.config_path }}
          COLLECTION_DIR: ${{ inputs.collection_dir }}
          START_MOCK_SERVER: ${{ inputs.start_mock_server }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          # base_branch names the branch origin/<base_branch> tracks; revision syntax (dev~1, @{-1}) would pick another commit.
          if [[ "$BASE_BRANCH" == *"@{"* ]] || ! git check-ref-format --branch "$BASE_BRANCH" > /dev/null 2>&1; then
            echo "::error::base_branch must be a branch name, got '$BASE_BRANCH'"
            exit 1
          fi
          # Path inputs are passed to apifn as operands; a leading '-' would be read as an option.
          for name in router_path config_path spec_path base_spec collection_dir; do
            case "$name" in
              router_path) value="$ROUTER_PATH" ;;
              config_path) value="$CONFIG_PATH" ;;
              spec_path) value="$SPEC_PATH" ;;
              base_spec) value="$BASE_SPEC" ;;
              collection_dir) value="$COLLECTION_DIR" ;;
            esac
            if [[ "$value" == -* ]]; then
              echo "::error::$name must not start with '-', got '$value'"
              exit 1
            fi
          done
          case "$CLI_SOURCE" in
            npm) ;;
            workspace)
              # The workspace build runs the caller's checkout of apifn/cli; only this repository has one.
              if [ "$CALLER_REPOSITORY" != "21nCo/superfunctions" ]; then
                echo "::error::cli_source: workspace builds @apifn/cli from the checked-out repository and is allowed only in 21nCo/superfunctions (caller: $CALLER_REPOSITORY). Use cli_source: npm."
                exit 1
              fi
              ;;
            *)
              echo "::error::cli_source must be npm or workspace, got '$CLI_SOURCE'"
              exit 1
              ;;
          esac
          if [ -z "$ROUTER_PATH" ] && [ -z "$SPEC_PATH" ]; then
            echo "::error::spec_path is required without router_path"
            exit 1
          fi
          if [ -z "$ROUTER_PATH" ] && [ -n "$BASE_SPEC" ]; then
            echo "::error::base_spec applies only with router_path"
            exit 1
          fi
          # The mock server serves spec_path (relative to working_directory with router_path); it is never inferred from a config.
          if [ "$START_MOCK_SERVER" == "true" ] && [ -n "$COLLECTION_DIR" ] && [ -z "$SPEC_PATH" ]; then
            echo "::error::start_mock_server needs spec_path"
            exit 1
          fi

      # Router mode runs the caller's install scripts and imports its router and config, so the token is not left in
      # .git/config for them; fetch-depth 0 already fetched origin/<base_branch>. The legacy path keeps the default.
      - name: Checkout
        id: caller_checkout
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ inputs.router_path == '' }}

      - name: Setup Node
        id: setup_node
        if: ${{ !contains(steps.*.outcome, 'failure') }}
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch CLI lockfile from the workflow revision
        id: workflow_lockfile
        if: >-
          !contains(steps.*.outcome, 'failure') && inputs.cli_source != 'workspace' && (
          github.repository != job.workflow_repository ||
          steps.caller_checkout.outputs.commit != job.workflow_sha ||
          hashFiles('.github/apifn-cli-install/package-lock.json') == '')
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/apifn-cli-install
          path: .apifn-cli-lock
          persist-credentials: false

      - name: Install ApiFn CLI
        id: install_cli
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.cli_source != 'workspace' }}
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        env:
          APIFN_CLI_VERSION: ${{ inputs.cli_version }}
          WORKFLOW_LOCKFILE_FETCHED: ${{ steps.workflow_lockfile.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_LOCKFILE_FETCHED" == "true" ]; then
            LOCK_DIR=".apifn-cli-lock/.github/apifn-cli-install"
          else
            LOCK_DIR=".github/apifn-cli-install"
          fi
          npm ci --ignore-scripts --prefix "$LOCK_DIR"
          BIN_DIR="$PWD/$LOCK_DIR/node_modules/.bin"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          INSTALLED="$(node -p "require('$PWD/$LOCK_DIR/node_modules/@apifn/cli/package.json').version")"
          echo "Installed @apifn/cli@$INSTALLED from lockfile"
          if [ "$INSTALLED" != "$APIFN_CLI_VERSION" ]; then
            echo "::error::cli_version input is $APIFN_CLI_VERSION; lockfile installed $INSTALLED"
            exit 1
          fi
          "$BIN_DIR/apifn" --version

      # Same install and build as the repository's CI: no install scripts except esbuild's, plus the native Rollup package.
      - name: Build ApiFn CLI from the workspace
        id: build_cli
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.cli_source == 'workspace' }}
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm rebuild esbuild
          node scripts/ci-install-rollup-native.mjs
          ./node_modules/.bin/turbo run build --filter='@apifn/cli...'
          BIN_DIR="$RUNNER_TEMP/apifn-workspace-bin"
          mkdir -p "$BIN_DIR"
          printf '#!/usr/bin/env bash\nexec node %q "$@"\n' "$PWD/apifn/cli/dist/bin.js" > "$BIN_DIR/apifn"
          chmod +x "$BIN_DIR/apifn"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "Built @apifn/cli@$(node -p "require('./apifn/cli/package.json').version") from the workspace"
          "$BIN_DIR/apifn" --version

      # Runs before any caller code. The checkout fetched every branch, so the token is used only when the base ref is
      # missing, and then only through this command's environment.
      - name: Fetch base branch
        id: fetch_base
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.router_path != '' && inputs.base_spec == '' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/remotes/origin/${BASE_BRANCH}^{commit}" > /dev/null; then
            echo "origin/${BASE_BRANCH} was fetched by the checkout."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      # The router module imports the caller's packages, so they are installed first. npm ci runs the caller's
      # lifecycle scripts; apifn check reads the spec and router from the working tree, so an install that changes
      # tracked files or adds untracked ones (a prepare script regenerating the spec) fails closed instead of
      # hiding drift.
      - name: Install caller dependencies
        id: install_caller
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.router_path != '' }}
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          CLI_SOURCE: ${{ inputs.cli_source }}
        run: |
          set -euo pipefail
          if [ "$CLI_SOURCE" == "workspace" ] && [ "$(pwd -P)" == "$(cd "$GITHUB_WORKSPACE" && pwd -P)" ]; then
            echo "The workspace CLI build already installed the repository root."
            exit 0
          fi
          if [ ! -f package.json ]; then
            echo "No package.json in $PWD; nothing to install."
            exit 0
          fi
          # node_modules (at the root or nested) is the install's own output, even where the caller's .gitignore does
          # not list it, so it is excluded by pathspec.
          outside_node_modules=(-- . ':(exclude,glob)**/node_modules/**')
          tree_state() {
            git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all "${outside_node_modules[@]}"
            git -C "$GITHUB_WORKSPACE" diff --binary HEAD "${outside_node_modules[@]}"
          }
          before="$(tree_state | sha256sum)"
          npm ci
          if [ "$(tree_state | sha256sum)" != "$before" ]; then
            git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all "${outside_node_modules[@]}"
            echo "::error::npm ci in $PWD changed the checked-out files (listed above); apifn check must read the committed router and spec. Keep generated files out of install scripts or ignore them."
            exit 1
          fi

      # Markdown for the summary and PR comment, JSON for the outputs. Both reports are written outside the checkout by
      # --report, so output the caller's router or config prints while loading cannot corrupt them; the summary step
      # cross-checks the two runs (exit codes, verdict, drift, breaking) and reports an error when they disagree. An
      # HTTP(S) base_spec is downloaded once, so both runs diff against the same document. After both runs the spec
      # the report names, and every symlink on its path, must still be committed at HEAD (spec_state committed, or
      # missing at both), so a spec generated or rewritten by the install, the router or the config cannot hide drift.
      - name: Run apifn check
        id: check
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.router_path != '' }}
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          ROUTER_PATH: ${{ inputs.router_path }}
          CONFIG_PATH: ${{ inputs.config_path }}
          SPEC_PATH: ${{ inputs.spec_path }}
          BASE_SPEC: ${{ inputs.base_spec }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          ALLOW_BREAKING: ${{ inputs.allow_breaking }}
          # Prints "committed", "missing" or "changed", then the reason, for the spec (argv 3) relative to the physical
          # directory (argv 2) under the repository root (argv 1).
          SPEC_WALK: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const [top, base, spec] = process.argv.slice(1);
            const done = (state, detail) => { process.stdout.write(`${state}\n${detail}\n`); process.exit(0); };
            const env = { ...process.env, GIT_LITERAL_PATHSPECS: '1' };
            const git = (...args) => execFileSync('git', ['-C', top, ...args], { encoding: 'utf8', env, stdio: ['ignore', 'pipe', 'ignore'] });
            const headEntry = (rel) => {
              for (const line of git('ls-tree', '-z', '--full-tree', 'HEAD', '--', rel).split('\0')) {
                const tab = line.indexOf('\t');
                const [mode, type, oid] = line.slice(0, tab).split(' ');
                if (tab !== -1 && line.slice(tab + 1) === rel) return { mode, type, oid };
              }
              return null;
            };
            const parts = (value) => value.split('/').filter((part) => part !== '' && part !== '.');
            const baseRel = path.relative(top, base);
            if (path.isAbsolute(spec) || path.isAbsolute(baseRel) || baseRel === '..' || baseRel.startsWith('../')) {
              done('changed', `${spec} is not a path inside the repository`);
            }
            let pending = [...parts(baseRel), ...parts(spec)];
            const resolved = [];
            let hops = 0;
            let missing = false;
            while (pending.length > 0) {
              const part = pending.shift();
              if (part === '..') {
                if (resolved.length === 0) done('changed', `${spec} leads outside the repository`);
                resolved.pop();
                continue;
              }
              resolved.push(part);
              if (missing) continue;
              const rel = resolved.join('/');
              let stat;
              try {
                stat = fs.lstatSync(path.join(top, rel));
              } catch {
                missing = true;
                continue;
              }
              if (!stat.isSymbolicLink()) continue;
              hops += 1;
              const target = fs.readlinkSync(path.join(top, rel));
              const entry = headEntry(rel);
              if (hops > 40 || entry === null || entry.mode !== '120000' || git('cat-file', 'blob', entry.oid) !== target) {
                done('changed', `the symlink ${rel} is not committed at HEAD with the target ${target}`);
              }
              if (path.isAbsolute(target)) done('changed', `the symlink ${rel} has an absolute target`);
              resolved.pop();
              pending = [...parts(target), ...pending];
            }
            const rel = resolved.join('/');
            const entry = rel === '' ? null : headEntry(rel);
            if (missing) done(entry === null ? 'missing' : 'changed', `${rel} is not in the checkout`);
            if (!fs.lstatSync(path.join(top, rel)).isFile()) done('changed', `${rel} is not a regular file`);
            if (entry === null || entry.type !== 'blob' || entry.mode === '120000') done('changed', `${rel} is not committed at HEAD`);
            if (git('hash-object', `--path=${rel}`, '--', rel).trim() !== entry.oid) done('changed', `${rel} differs from HEAD`);
            done('committed', rel);
        run: |
          set +e
          top="$(git rev-parse --show-toplevel)"
          base_dir="$(pwd -P)"
          rm -f "$RUNNER_TEMP/apifn-check.md" "$RUNNER_TEMP/apifn-check.json" "$RUNNER_TEMP/apifn-base-spec"
          args=("$ROUTER_PATH")
          if [ -n "$CONFIG_PATH" ]; then args+=(--config "$CONFIG_PATH"); fi
          if [ -n "$SPEC_PATH" ]; then args+=(--spec "$SPEC_PATH"); fi
          if [[ "$BASE_SPEC" =~ ^[Hh][Tt][Tt][Pp][Ss]?:// ]]; then
            if ! curl --fail --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/apifn-base-spec" -- "$BASE_SPEC"; then
              echo "::error::Could not download base_spec $BASE_SPEC"
              printf 'exit_code=2\njson_exit_code=2\nspec_state=\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            args+=(--base-spec "$RUNNER_TEMP/apifn-base-spec")
          elif [ -n "$BASE_SPEC" ]; then
            args+=(--base-spec "$BASE_SPEC")
          else
            args+=(--base "origin/${BASE_BRANCH}")
          fi
          if [ "$ALLOW_BREAKING" == "true" ]; then args+=(--allow-breaking); fi
          apifn check "${args[@]}" --format markdown --report "$RUNNER_TEMP/apifn-check.md"
          code=$?
          apifn check "${args[@]}" --format json --report "$RUNNER_TEMP/apifn-check.json" > /dev/null
          json_code=$?
          spec="$(node -e 'try { const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (typeof r.spec === "string") process.stdout.write(r.spec); } catch {}' "$RUNNER_TEMP/apifn-check.json")"
          spec_state=""
          if [ -n "$spec" ]; then
            # The report names the spec relative to this directory. Each component of that path is followed from the
            # repository root: every symlink on the way must be committed at HEAD with the same target, and the file
            # it reaches must be committed at HEAD with the same content. A spec absent from both is missing.
            walk="$(node -e "$SPEC_WALK" "$top" "$base_dir" "$spec")" || walk=$'changed\nthe spec check did not complete'
            spec_state="${walk%%$'\n'*}"
            case "$spec_state" in
              committed | missing) ;;
              *)
                spec_state=changed
                echo "::error::The spec apifn check read ($spec) is not the file committed at HEAD: ${walk#*$'\n'}. The install, the router or the config created or changed it, or it is outside the repository; the check must read the committed spec."
                ;;
            esac
          fi
          printf 'exit_code=%s\njson_exit_code=%s\nspec_state=%s\n' "$code" "$json_code" "$spec_state" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve base spec from base branch
        id: base_spec
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.router_path == '' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" --depth=1
          if git show "origin/${BASE_BRANCH}:${SPEC_PATH}" > .apifn-base-openapi.yml; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            printf '{"hasBreakingChanges":false,"summary":{"breaking":0,"nonBreaking":0,"added":0,"removed":0,"modified":0},"breaking":[],"nonBreaking":[],"timestamp":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > diff-report.json
          fi

      - name: Validate OpenAPI
        id: validate
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.router_path == '' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set +e
          apifn validate "$SPEC_PATH" --format json > validate-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diff OpenAPI against base branch
        id: diff
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.router_path == '' && steps.base_spec.outputs.found == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          FAIL_ON_BREAKING: ${{ inputs.fail_on_breaking }}
        run: |
          set +e
          DIFF_ARGS=()
          if [ "$FAIL_ON_BREAKING" != "true" ]; then
            DIFF_ARGS+=(--no-fail-on-breaking)
          fi
          apifn diff .apifn-base-openapi.yml "$SPEC_PATH" --format json "${DIFF_ARGS[@]}" > diff-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # spec_path is relative to working_directory with router_path, as apifn check reads it.
      # A mock that does not start fails the tests (and the job) through the summary and gates, which still run.
      - name: Start smoke mock server
        id: mock
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.collection_dir != '' && (inputs.start_mock_server == true || inputs.start_mock_server == 'true') }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ inputs.router_path != '' && inputs.working_directory || '.' }}
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          MOCK_PORT: ${{ inputs.mock_port }}
        run: |
          set -euo pipefail
          apifn mock "$SPEC_PATH" --port "$MOCK_PORT" > "$RUNNER_TEMP/apifn-mock.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/apifn-mock.pid"
          for _ in {1..30}; do
            # Any HTTP response means the mock accepted a connection. Do not
            # require GET /users — caller specs may not define that route.
            if curl --silent --output /dev/null --max-time 1 "http://127.0.0.1:${MOCK_PORT}/"; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/apifn-mock.log"
          exit 1

      # D3: collections are optional; without collection_dir the tests are reported as not run.
      - name: Run collection tests
        id: test
        if: ${{ !contains(steps.*.outcome, 'failure') && inputs.collection_dir != '' }}
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          COLLECTION_DIR: ${{ inputs.collection_dir }}
          COLLECTION_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set +e
          apifn test "$COLLECTION_DIR" --env "$COLLECTION_ENVIRONMENT" --reporter json > test-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop smoke mock server
        if: always() && inputs.collection_dir != '' && (inputs.start_mock_server == true || inputs.start_mock_server == 'true')
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/apifn-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/apifn-mock.pid")" || true
          fi

      - name: Build markdown summary
        id: result
        if: ${{ !cancelled() }}
        shell: bash
        env:
          # The first step that failed before the API check ran, or empty.
          SETUP_FAILED_STEP: >-
            ${{
            steps.inputs.outcome == 'failure' && 'Check inputs' ||
            steps.caller_checkout.outcome == 'failure' && 'Checkout' ||
            steps.setup_node.outcome == 'failure' && 'Setup Node' ||
            steps.workflow_lockfile.outcome == 'failure' && 'Fetch CLI lockfile from the workflow revision' ||
            steps.install_cli.outcome == 'failure' && 'Install ApiFn CLI' ||
            steps.build_cli.outcome == 'failure' && 'Build ApiFn CLI from the workspace' ||
            steps.fetch_base.outcome == 'failure' && 'Fetch base branch' ||
            steps.install_caller.outcome == 'failure' && 'Install caller dependencies' ||
            steps.base_spec.outcome == 'failure' && 'Resolve base spec from base branch' ||
            '' }}
          ROUTER_PATH: ${{ inputs.router_path }}
          COLLECTION_DIR: ${{ inputs.collection_dir }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
          CHECK_JSON_EXIT_CODE: ${{ steps.check.outputs.json_exit_code }}
          CHECK_SPEC_STATE: ${{ steps.check.outputs.spec_state }}
          ALLOW_BREAKING: ${{ inputs.allow_breaking }}
          MOCK_OUTCOME: ${{ steps.mock.outcome }}
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          DIFF_EXIT_CODE: ${{ steps.diff.outcome == 'failure' && '1' || steps.diff.outputs.exit_code }}
          TEST_EXIT_CODE: ${{ (steps.mock.outcome == 'failure' || steps.test.outcome == 'failure') && '1' || steps.test.outputs.exit_code }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');

          function readJson(file, fallback) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return fallback; }
          }
          function readText(file) {
            try { return fs.readFileSync(file, 'utf8'); } catch { return null; }
          }
          // The semver core of a contract version, as apifn check parses it (build metadata and prerelease ignored).
          function semverCore(version) {
            if (typeof version !== 'string') return null;
            const plus = version.indexOf('+');
            const build = plus === -1 ? null : version.slice(plus + 1);
            const withoutBuild = plus === -1 ? version : version.slice(0, plus);
            const dash = withoutBuild.indexOf('-');
            const prerelease = dash === -1 ? null : withoutBuild.slice(dash + 1);
            const core = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(dash === -1 ? withoutBuild : withoutBuild.slice(0, dash));
            if (!core) return null;
            if (prerelease !== null && !prerelease.split('.').every((id) => /^(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)$/.test(id))) return null;
            if (build !== null && !build.split('.').every((id) => /^[0-9a-zA-Z-]+$/.test(id))) return null;
            return { major: BigInt(core[1]), minor: BigInt(core[2]) };
          }
          // D7: a major bump covers a breaking change, or a minor bump while both majors are 0.
          function versionCoversBreaking(base, head) {
            const b = semverCore(base);
            const h = semverCore(head);
            if (!b || !h) return false;
            if (h.major > b.major) return true;
            return b.major === 0n && h.major === 0n && h.minor > b.minor;
          }

          const env = process.env;
          const marker = '<!-- apifn-ci-report -->';
          const collectionRun = env.COLLECTION_DIR !== '';
          const test = readJson('test-report.json', { summary: { total: 0, passed: 0, failed: 0, skipped: 0, errors: 0 } });
          const testFailed = collectionRun && Boolean(env.TEST_EXIT_CODE !== '0' || test.summary.failed || test.summary.errors);
          let testStatus = 'PASS';
          if (!collectionRun) testStatus = 'NOT RUN';
          else if (testFailed) testStatus = 'FAIL';
          let testLine = '- Tests: **NOT RUN** (no collection_dir)';
          if (env.MOCK_OUTCOME === 'failure') testLine = '- Tests: **FAIL** (the smoke mock server did not start; see the job log)';
          else if (collectionRun) testLine = `- Tests: **${testStatus}** (passed=${test.summary.passed ?? 0}, failed=${test.summary.failed ?? 0}, errors=${test.summary.errors ?? 0})`;
          const testTable = collectionRun
            ? [
                '',
                '### Test Summary',
                '',
                '| Metric | Value |',
                '|---|---:|',
                `| Total | ${test.summary.total ?? 0} |`,
                `| Passed | ${test.summary.passed ?? 0} |`,
                `| Failed | ${test.summary.failed ?? 0} |`,
                `| Skipped | ${test.summary.skipped ?? 0} |`,
                `| Errors | ${test.summary.errors ?? 0} |`,
              ]
            : [];

          let body;
          let verdict;
          let drift = '';
          let breaking = '';

          if (env.SETUP_FAILED_STEP !== '') {
            verdict = 'fail';
            body = [marker, '## ApiFn API check: **ERROR**', '', `The step "${env.SETUP_FAILED_STEP}" failed, so the API check did not run. See the job log.`];
          } else if (env.ROUTER_PATH !== '') {
            const report = readJson(path.join(env.RUNNER_TEMP, 'apifn-check.json'), null);
            const markdown = readText(path.join(env.RUNNER_TEMP, 'apifn-check.md'));
            const code = env.CHECK_EXIT_CODE;
            const verdicts = ['pass', 'warn', 'fail'];
            const hasReport = report !== null && typeof report === 'object' && verdicts.includes(report.verdict);
            // The Markdown and JSON reports come from two runs: the Markdown one is shown only when its verdict,
            // drift and breaking-change rows say what the JSON report says, and exit 0 (pass or warn) or 1 (fail)
            // matches the verdict in both runs.
            const markdownLines = markdown === null ? [] : markdown.split('\n');
            const markdownAgrees = () => {
              const diffBreaking = report.diff && Array.isArray(report.diff.breaking) ? String(report.diff.breaking.length) : '-';
              const driftRow = markdownLines.find((line) => line.startsWith('| Drift | '));
              return (
                markdownLines[0] === marker &&
                markdownLines[1] === `## ApiFn check: **${report.verdict.toUpperCase()}**` &&
                driftRow !== undefined &&
                (driftRow === '| Drift | none |') === (report.drift === false) &&
                markdownLines.includes(`| Breaking | ${diffBreaking} |`)
              );
            };
            // The spec the report names must be the file committed at HEAD; a spec missing from both the checkout
            // and HEAD is a drift report, which must say so.
            const specState = env.CHECK_SPEC_STATE;
            const specCommitted =
              hasReport && (specState === 'committed' || (specState === 'missing' && report.drift === true && report.verdict === 'fail'));
            const consistent =
              specCommitted &&
              hasReport &&
              typeof report.drift === 'boolean' &&
              Array.isArray(report.breaking) &&
              (code === '0' || code === '1') &&
              env.CHECK_JSON_EXIT_CODE === code &&
              (report.verdict === 'fail') === (code === '1') &&
              markdownAgrees();
            if (consistent) {
              drift = String(report.drift);
              breaking = String(report.breaking.length > 0);
            }
            let checkVerdict = consistent ? report.verdict : 'fail';
            // Only allow_breaking allows a breaking change the contract version does not cover (D7, as apifn check
            // applies it): diff.failOnBreaking false in the caller's config makes apifn check warn, and the workflow
            // fails it instead.
            let policyNote = null;
            if (consistent && env.ALLOW_BREAKING !== 'true' && checkVerdict !== 'fail' && report.breaking.length > 0) {
              const versions = report.versions ?? {};
              if (!versionCoversBreaking(versions.base, versions.head)) {
                checkVerdict = 'fail';
                policyNote = `> The workflow fails this check: ${report.breaking.length} breaking change(s) without a major version bump (base ${versions.base ?? '-'}, head ${versions.head ?? '-'}). allow_breaking is false, so \`diff.failOnBreaking: false\` in the apifn config does not allow them.`;
              }
            }
            let error = `apifn check did not produce consistent reports (Markdown run exit ${code || '-'}, JSON run exit ${env.CHECK_JSON_EXIT_CODE || '-'}; exit 2 is a usage or load error, and the two runs must agree on the verdict, drift and breaking changes). See the job log.`;
            if (hasReport && !specCommitted) {
              error = `The spec apifn check read (\`${String(report.spec)}\`) is not the file committed at HEAD: the install, the router or the config created or changed it. The check must read the committed spec. See the job log.`;
            }
            let lines = [marker, '## ApiFn check: **ERROR**', '', error];
            if (consistent && policyNote === null) lines = [markdown.trimEnd()];
            if (consistent && policyNote !== null) {
              lines = [marker, '## ApiFn check: **FAIL**', '', policyNote, ...markdown.trimEnd().split('\n').slice(2)];
            }
            lines.push('', '### Collection tests', '', testLine, ...testTable);
            body = lines;
            if (checkVerdict === 'fail' || testFailed) verdict = 'fail';
            else verdict = checkVerdict;
          } else {
            const validate = readJson('validate-report.json', { ok: false, errors: [{ path: '', message: 'missing validate report' }] });
            const diffReport = readJson('diff-report.json', null);
            const diff = diffReport ?? { hasBreakingChanges: false, summary: { breaking: 0, nonBreaking: 0, added: 0, removed: 0, modified: 0 } };
            const validateStatus = validate.ok ? 'PASS' : 'FAIL';
            const diffStatus = diff.hasBreakingChanges ? 'BREAKING' : 'OK';
            // Empty when apifn diff produced no report, as the breaking output documents.
            if (diffReport !== null && typeof diffReport.hasBreakingChanges === 'boolean') {
              breaking = String(diffReport.hasBreakingChanges);
            }
            const diffCode = env.DIFF_EXIT_CODE || '0';
            verdict = env.VALIDATE_EXIT_CODE !== '0' || diffCode !== '0' || testFailed ? 'fail' : 'pass';
            body = [
              marker,
              '## ApiFn CI Summary',
              '',
              `- Validate: **${validateStatus}**`,
              `- Diff: **${diffStatus}** (breaking=${diff.summary.breaking ?? 0}, non-breaking=${diff.summary.nonBreaking ?? 0})`,
              testLine,
              '',
              '### Diff Summary',
              '',
              '| Metric | Value |',
              '|---|---:|',
              `| Breaking | ${diff.summary.breaking ?? 0} |`,
              `| Non-breaking | ${diff.summary.nonBreaking ?? 0} |`,
              `| Added | ${diff.summary.added ?? 0} |`,
              `| Removed | ${diff.summary.removed ?? 0} |`,
              `| Modified | ${diff.summary.modified ?? 0} |`,
              ...testTable,
            ];
          }

          const text = `${body.join('\n')}\n`;
          fs.writeFileSync(path.join(env.RUNNER_TEMP, 'apifn-ci-summary.md'), text);
          // A step summary holds at most 1 MiB; the full report always goes to the job log.
          console.log(text);
          const summaryLimit = 1000 * 1000;
          fs.appendFileSync(
            env.GITHUB_STEP_SUMMARY,
            Buffer.byteLength(text) <= summaryLimit
              ? text
              : `${Buffer.from(text).subarray(0, summaryLimit).toString('utf8').replace(/\uFFFD*$/, '')}\n\n_Report truncated; the full report is in the job log._\n`
          );
          // The api-check job posts this as the PR comment, which holds at most 65536 characters: a longer report
          // keeps its head and points at the job summary.
          const limit = 60000;
          const runUrl = `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`;
          const cut = text.lastIndexOf('\n', limit);
          const comment = text.length <= limit
            ? text
            : `${text.slice(0, cut > 0 ? cut : limit)}\n\n_Report truncated; the full report is in the [job summary](${runUrl})._\n`;
          const delimiter = `APIFN_COMMENT_${require('node:crypto').randomBytes(16).toString('hex')}`;
          fs.appendFileSync(
            env.GITHUB_OUTPUT,
            `verdict=${verdict}\ndrift=${drift}\nbreaking=${breaking}\nsetup_failed_step=${env.SETUP_FAILED_STEP}\ncomment<<${delimiter}\n${comment}\n${delimiter}\n`
          );
          JS

      # The gate decision, applied by the api-check job. A step that failed before the check ran fails it whatever
      # enforce_gates says, as does a summary that did not finish.
      - name: Decide CI gates
        id: gates
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SETUP_FAILED_STEP: ${{ steps.result.outcome != 'success' && 'Build markdown summary' || steps.result.outputs.setup_failed_step }}
          ROUTER_PATH: ${{ inputs.router_path }}
          ENFORCE_GATES: ${{ inputs.enforce_gates }}
          VERDICT: ${{ steps.result.outputs.verdict }}
          CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
          VALIDATE_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          DIFF_EXIT_CODE: ${{ steps.diff.outcome == 'failure' && '1' || steps.diff.outputs.exit_code }}
          TEST_EXIT_CODE: ${{ (steps.mock.outcome == 'failure' || steps.test.outcome == 'failure') && '1' || steps.test.outputs.exit_code }}
        run: |
          set +e
          (
            set -euo pipefail

            if [ -n "$SETUP_FAILED_STEP" ]; then
              echo "::error::The step \"$SETUP_FAILED_STEP\" failed, so the API check did not run (enforce_gates does not apply)"
              exit 1
            fi

            if [ "$ENFORCE_GATES" != "true" ]; then
              echo "::notice::enforce_gates is false: verdict=$VERDICT is reported without failing the job"
              exit 0
            fi

            test_code="${TEST_EXIT_CODE:-0}"

            if [ -n "$ROUTER_PATH" ]; then
              if [ "$VERDICT" == "fail" ]; then
                check_code="${CHECK_EXIT_CODE:-1}"
                if [ "$check_code" == "0" ]; then check_code=1; fi
                echo "apifn check failed (verdict=$VERDICT, exit=${CHECK_EXIT_CODE:-none})"
                if [ "$test_code" != "0" ]; then echo "Collection tests failed (exit=$test_code)"; fi
                exit "$check_code"
              fi
              exit 0
            fi

            validate_code="$VALIDATE_EXIT_CODE"
            diff_code="${DIFF_EXIT_CODE:-0}"

            if [ "$validate_code" != "0" ]; then
              echo "Validation failed (exit=$validate_code)"
              exit "$validate_code"
            fi

            if [ "$diff_code" != "0" ]; then
              echo "Diff failed (exit=$diff_code)"
              exit "$diff_code"
            fi

            if [ "$test_code" != "0" ]; then
              echo "Collection tests failed (exit=$test_code)"
              exit "$test_code"
            fi
          )
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Posts the comment and applies the gate the evaluate job decided. It runs only after the evaluate job succeeds, which
  # it does unless it is cancelled or its runner is lost: every failure before or during the check is reported there.
  # This is the only job whose token can write to the pull request; it checks out, installs and imports nothing.
  api-check:
    needs: evaluate
    if: github.repository == '21nCo/superfunctions' || inputs.called_as_reusable_workflow == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      verdict: ${{ needs.evaluate.outputs.verdict || 'fail' }}
      drift: ${{ needs.evaluate.outputs.drift }}
      breaking: ${{ needs.evaluate.outputs.breaking }}

    steps:
      - name: Post/Update PR comment
        # workflow_call sets github.event_name to "workflow_call", not "pull_request".
        # The caller payload is reused, so gate on PR number instead of event name.
        # workflow_dispatch inputs are strings, so accept boolean true or "true".
        # Fork PRs get a read-only token; skip mutation so gates still run.
        # The evaluate job wrote the job summary.
        if: (inputs.post_pr_comment == true || inputs.post_pr_comment == 'true') && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          APIFN_COMMENT: ${{ needs.evaluate.outputs.comment }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request?.number;
            if (!issue_number) {
              core.info('No pull request number in event payload; skipping comment.');
              return;
            }
            const marker = '<!-- apifn-ci-report -->';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // The evaluate job bounded the report under the comment limit and kept the marker.
            const body = process.env.APIFN_COMMENT
              ? process.env.APIFN_COMMENT
              : `${marker}\n## ApiFn API check: **ERROR**\n\nThe evaluate job produced no report; see the [run](${runUrl}).\n`;

            // The comment only mirrors the job summary and the next step decides the job, so a failed post is a warning.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              core.warning(`Could not post the API check comment: ${error.message}`);
            }

      - name: Enforce CI gates
        shell: bash
        env:
          GATE_CODE: ${{ needs.evaluate.outputs.gate_code }}
          VERDICT: ${{ needs.evaluate.outputs.verdict }}
        run: |
          set -euo pipefail
          if ! [[ "$GATE_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::The evaluate job reported no gate result (verdict=${VERDICT:-none}); see its log."
            exit 1
          fi
          if [ "$GATE_CODE" != "0" ]; then
            echo "::error::The API check failed (verdict=${VERDICT:-none}, exit $GATE_CODE); see the evaluate job's summary and log."
            exit "$GATE_CODE"
          fi
          echo "The API check passed its gates (verdict=$VERDICT)."
