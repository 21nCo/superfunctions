name: ApiFn Reusable Workflow Smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/apifn-api-check.yml"
      - ".github/workflows/apifn-api-check-smoke.yml"
      - "apifn/cli/**"
      - "apifn/examples/ci-cd/github-actions.yml"

# Each job that calls the API check workflow grants pull-requests: write: the
# called workflow requests it and cannot elevate the caller token, so without
# it GitHub rejects the call with startup_failure, even when post_pr_comment is
# false.
permissions:
  contents: read

jobs:
  actionlint:
    if: github.repository == '21nCo/superfunctions'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # actionlint runs shellcheck (preinstalled on ubuntu-latest) on every run: script. It does not know the job
      # context's workflow_repository and workflow_sha yet, which the API check workflow uses to find its own revision.
      - name: Lint the API check workflows and the CI example
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --proto =https --proto-redir =https --output "$dir/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" actionlint
          "$dir/actionlint" -version
          "$dir/actionlint" \
            -ignore 'property "workflow_(repository|sha)" is not defined in object type' \
            .github/workflows/apifn-api-check.yml \
            .github/workflows/apifn-api-check-smoke.yml \
            apifn/examples/ci-cd/github-actions.yml

  api-check:
    if: github.repository == '21nCo/superfunctions'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      spec_path: apifn/cli/__tests__/fixtures/diff/before.yml
      collection_dir: apifn/cli/__tests__/fixtures/passing-collection
      environment: development
      base_branch: dev
      fail_on_breaking: false
      post_pr_comment: false
      start_mock_server: true
      mock_port: 19999

  # apifn check from the router against the spec committed at origin/dev (a new contract until this fixture lands).
  router-compatible:
    if: github.repository == '21nCo/superfunctions'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      router_path: apifn/cli/__tests__/fixtures/check-smoke/compatible/router.ts
      config_path: apifn/cli/__tests__/fixtures/check-smoke/compatible/apifn.config.ts
      spec_path: apifn/cli/__tests__/fixtures/check-smoke/compatible/openapi.yml
      cli_source: workspace
      base_branch: dev
      post_pr_comment: false

  # A breaking change with only a minor bump against the compatible spec. enforce_gates: false keeps this caller
  # non-blocking (a job calling a reusable workflow cannot set continue-on-error); router-outputs asserts the failure.
  router-breaking:
    if: github.repository == '21nCo/superfunctions'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      router_path: apifn/cli/__tests__/fixtures/check-smoke/breaking/router.ts
      config_path: apifn/cli/__tests__/fixtures/check-smoke/breaking/apifn.config.ts
      spec_path: apifn/cli/__tests__/fixtures/check-smoke/breaking/openapi.yml
      base_spec: apifn/cli/__tests__/fixtures/check-smoke/compatible/openapi.yml
      allow_breaking: false
      enforce_gates: false
      cli_source: workspace
      post_pr_comment: false

  # The fixture's committed spec includes a route its router serves only after its postinstall script ran, and one
  # served only after the prepare script of its directory dependency (installed as a copy) ran.
  # allow_install_scripts: true runs npm ci with lifecycle scripts, so the check passes.
  router-install-scripts:
    if: github.repository == '21nCo/superfunctions'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      working_directory: apifn/cli/__tests__/fixtures/check-smoke/install-scripts
      router_path: router.ts
      config_path: apifn.config.ts
      spec_path: openapi.yml
      allow_install_scripts: true
      cli_source: workspace
      base_branch: dev
      post_pr_comment: false

  # The default (allow_install_scripts omitted) runs npm ci --ignore-scripts, and an explicit false does the same:
  # openapi.scripts-off.yml has neither script-gated route, so the check passes against it only when neither the
  # postinstall script nor the dependency's prepare script ran (npm 10.8 would still run that prepare). base_spec pins
  # the base to the same file, so the result is the same before and after the fixture lands on dev.
  router-install-scripts-default:
    if: github.repository == '21nCo/superfunctions'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      working_directory: apifn/cli/__tests__/fixtures/check-smoke/install-scripts
      router_path: router.ts
      config_path: apifn.config.ts
      spec_path: openapi.scripts-off.yml
      base_spec: openapi.scripts-off.yml
      cli_source: workspace
      base_branch: dev
      post_pr_comment: false

  router-install-scripts-false:
    if: github.repository == '21nCo/superfunctions'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/apifn-api-check.yml
    with:
      working_directory: apifn/cli/__tests__/fixtures/check-smoke/install-scripts
      router_path: router.ts
      config_path: apifn.config.ts
      spec_path: openapi.scripts-off.yml
      base_spec: openapi.scripts-off.yml
      allow_install_scripts: false
      cli_source: workspace
      base_branch: dev
      post_pr_comment: false

  router-outputs:
    needs: [router-compatible, router-breaking, router-install-scripts, router-install-scripts-default, router-install-scripts-false]
    if: github.repository == '21nCo/superfunctions' && (always())
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert the reusable workflow outputs
        shell: bash
        env:
          COMPATIBLE_RESULT: ${{ needs.router-compatible.result }}
          COMPATIBLE_VERDICT: ${{ needs.router-compatible.outputs.verdict }}
          COMPATIBLE_DRIFT: ${{ needs.router-compatible.outputs.drift }}
          COMPATIBLE_BREAKING: ${{ needs.router-compatible.outputs.breaking }}
          BREAKING_RESULT: ${{ needs.router-breaking.result }}
          BREAKING_VERDICT: ${{ needs.router-breaking.outputs.verdict }}
          BREAKING_DRIFT: ${{ needs.router-breaking.outputs.drift }}
          BREAKING_BREAKING: ${{ needs.router-breaking.outputs.breaking }}
          SCRIPTS_RESULT: ${{ needs.router-install-scripts.result }}
          SCRIPTS_VERDICT: ${{ needs.router-install-scripts.outputs.verdict }}
          SCRIPTS_DRIFT: ${{ needs.router-install-scripts.outputs.drift }}
          NO_SCRIPTS_RESULT: ${{ needs.router-install-scripts-default.result }}
          NO_SCRIPTS_VERDICT: ${{ needs.router-install-scripts-default.outputs.verdict }}
          NO_SCRIPTS_DRIFT: ${{ needs.router-install-scripts-default.outputs.drift }}
          NO_SCRIPTS_BREAKING: ${{ needs.router-install-scripts-default.outputs.breaking }}
          FALSE_SCRIPTS_RESULT: ${{ needs.router-install-scripts-false.result }}
          FALSE_SCRIPTS_VERDICT: ${{ needs.router-install-scripts-false.outputs.verdict }}
          FALSE_SCRIPTS_DRIFT: ${{ needs.router-install-scripts-false.outputs.drift }}
          FALSE_SCRIPTS_BREAKING: ${{ needs.router-install-scripts-false.outputs.breaking }}
        run: |
          set -euo pipefail
          failed=0
          expect() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" == "$expected" ]; then
              echo "ok: $name=$actual"
            else
              echo "::error::$name is '$actual', expected '$expected'"
              failed=1
            fi
          }
          expect router-compatible.result "$COMPATIBLE_RESULT" success
          expect router-compatible.verdict "$COMPATIBLE_VERDICT" pass
          expect router-compatible.drift "$COMPATIBLE_DRIFT" false
          expect router-compatible.breaking "$COMPATIBLE_BREAKING" false
          expect router-breaking.result "$BREAKING_RESULT" success
          expect router-breaking.verdict "$BREAKING_VERDICT" fail
          expect router-breaking.drift "$BREAKING_DRIFT" false
          expect router-breaking.breaking "$BREAKING_BREAKING" true
          expect router-install-scripts.result "$SCRIPTS_RESULT" success
          expect router-install-scripts.verdict "$SCRIPTS_VERDICT" pass
          expect router-install-scripts.drift "$SCRIPTS_DRIFT" false
          expect router-install-scripts-default.result "$NO_SCRIPTS_RESULT" success
          expect router-install-scripts-default.verdict "$NO_SCRIPTS_VERDICT" pass
          expect router-install-scripts-default.drift "$NO_SCRIPTS_DRIFT" false
          expect router-install-scripts-default.breaking "$NO_SCRIPTS_BREAKING" false
          expect router-install-scripts-false.result "$FALSE_SCRIPTS_RESULT" success
          expect router-install-scripts-false.verdict "$FALSE_SCRIPTS_VERDICT" pass
          expect router-install-scripts-false.drift "$FALSE_SCRIPTS_DRIFT" false
          expect router-install-scripts-false.breaking "$FALSE_SCRIPTS_BREAKING" false
          exit "$failed"
