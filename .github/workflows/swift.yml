name: Swift

on:
  push:
    branches: [dev]
    paths:
      - "Package.swift"
      - "*/swift/**"
      - "uifn/tokens/**"
      - "uifn/theme/**"
      - "scripts/swift-release.mjs"
      - "scripts/swift-release.test.mjs"
      - ".github/workflows/swift.yml"
      - ".github/workflows/release-swift.yml"
      - "uifn/examples/swiftui-workbench/**"
  pull_request:
    paths:
      - "Package.swift"
      - "*/swift/**"
      - "uifn/tokens/**"
      - "uifn/theme/**"
      - "scripts/swift-release.mjs"
      - "scripts/swift-release.test.mjs"
      - ".github/workflows/swift.yml"
      - ".github/workflows/release-swift.yml"
      - "uifn/examples/swiftui-workbench/**"

permissions:
  contents: read

concurrency:
  group: swift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: swift build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Release product list matches Package.swift
        run: node --test scripts/swift-release.test.mjs
      - name: swift build
        run: swift build --only-use-versions-from-resolved-file
      # The UIFnSwiftUI tests hold the main actor while they render and drive
      # windows, so other modules' main-actor tests that wait on a deadline run
      # in a separate process. Each run still going after 10 minutes is
      # sampled, so the log shows every thread's stack, and stopped with all
      # its processes, killed if they outlast a 30-second TERM, so the job
      # fails and uploads its snapshots instead of being cancelled at the
      # timeout. The step fails if either run fails or times out, even when
      # the tests finish while they are being sampled.
      - name: swift test
        timeout-minutes: 25
        env:
          UIFN_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/uifn-snapshots
        run: |
          descendants() {
            local parent=$1
            for child in $(pgrep -P "$parent"); do
              echo "$child"
              descendants "$child"
            done
          }
          run_tests() {
            swift test --only-use-versions-from-resolved-file "$@" &
            local tests=$!
            # Checks every second, so it ends soon after the tests do and is
            # waited for, never left to act on the next run.
            (
              for _ in $(seq 600); do
                kill -0 "$tests" 2>/dev/null || exit 0
                sleep 1
              done
              echo "::error::swift test $* was still running after 10 minutes; sampling and stopping it"
              owned="$tests $(descendants "$tests")"
              for pid in $owned; do
                command=$(ps -o command= -p "$pid") || continue
                echo "$pid $command"
                case "$command" in
                  *swiftpm-testing-helper*|*xctest*)
                    sample "$pid" 5 -file "$RUNNER_TEMP/sample-$pid.txt" && cat "$RUNNER_TEMP/sample-$pid.txt" || true ;;
                  *) ;;
                esac
              done
              # The tree as it is now: a process may have started since.
              owned=$(printf '%s\n' $owned $(descendants "$tests") | sort -u)
              kill -TERM $owned 2>/dev/null || true
              for _ in $(seq 30); do
                alive=""
                for pid in $owned; do
                  kill -0 "$pid" 2>/dev/null && alive="$alive $pid"
                done
                [ -n "$alive" ] || exit 1
                sleep 1
              done
              echo "::error::swift test $* processes$alive outlasted TERM by 30 seconds; killing them"
              kill -KILL $alive 2>/dev/null || true
              exit 1
            ) &
            local watchdog=$!
            local status=0
            wait "$tests" || status=$?
            # The watchdog exits nonzero only when the run timed out.
            if ! wait "$watchdog" && [ "$status" -eq 0 ]; then
              status=1
            fi
            return "$status"
          }
          status=0
          run_tests --skip '^UIFnSwiftUITests\.' || status=$?
          run_tests --filter '^UIFnSwiftUITests\.' || status=$?
          exit "$status"
      - name: Upload UIFnSwiftUI snapshots that differ from their references
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uifn-snapshot-failures
          path: ${{ runner.temp }}/uifn-snapshots
          if-no-files-found: ignore
      - name: UIFnSwiftUI tests on an iOS simulator (UIKit trait collections)
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".SimRuntime.iOS-" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"])
                          raise SystemExit
          raise SystemExit("no available iPhone simulator")
          ')
          xcodebuild test -scheme SuperfunctionsSwift-Package -destination "id=$udid" \
            -only-testing:UIFnSwiftUITests -disableAutomaticPackageResolution

  # The SwiftUI workbench shows every UIFnSwiftUI style and component; its UI
  # tests run Xcode's accessibility audit on each screen in light and dark.
  # An issue fails the job unless the tests' waiver list, mirrored in the
  # workbench README, waives it.
  workbench:
    name: SwiftUI workbench accessibility audits (${{ matrix.platform }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
      # macOS UI tests drive the app through Automation Mode, which otherwise
      # asks for a password.
      - name: Enable Automation Mode for macOS UI tests
        if: matrix.platform == 'macOS'
        run: sudo automationmodetool enable-automationmode-without-authentication
      - name: Pick the test destination
        id: destination
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = macOS ]; then
            echo "destination=platform=macOS,arch=$(uname -m)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest iPhone simulator on iOS 17 or later.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              match = re.search(r"\.SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              return tuple(int(part) for part in match.groups()) if match else None
          runtimes = [runtime for runtime in devices if version(runtime) and version(runtime) >= (17, 0)]
          for runtime in sorted(runtimes, key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator on iOS 17 or later")
          ')
          echo "destination=id=$udid" >> "$GITHUB_OUTPUT"
          # Booted while the tests build, so they start on a warm simulator;
          # bootstatus -b boots a shut-down device and accepts a booted one.
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: xcodebuild build-for-testing (workbench)
        working-directory: uifn/examples/swiftui-workbench
        env:
          DESTINATION: ${{ steps.destination.outputs.destination }}
        run: |
          xcodebuild build-for-testing -project SwiftUIWorkbench.xcodeproj -scheme SwiftUIWorkbench \
            -destination "$DESTINATION" -disableAutomaticPackageResolution
      # A new iOS 26 simulator posts "Ready for Apple Intelligence" a few
      # minutes after it boots, and its banner covers the app. Wait until
      # followupd, which posts it, has added a notification request, so it
      # does not land during an audit; any followupd request ends the wait.
      # The tests also wait out any banner before each audit and fail if one
      # stays or shows while the audit reports an issue.
      - name: Wait for the simulator's first-boot notification
        if: matrix.platform == 'iOS'
        env:
          UDID: ${{ steps.destination.outputs.udid }}
        run: |
          for _ in $(seq 1 72); do
            if xcrun simctl spawn "$UDID" log show --last 30m --style compact \
              --predicate 'process == "followupd" AND composedMessage CONTAINS "Added notification request"' \
              | grep -q "Added notification request"; then
              echo "The first-boot notification was posted."
              exit 0
            fi
            sleep 5
          done
          echo "::notice::No first-boot notification within 6 minutes; the tests still wait out any banner."
      - name: xcodebuild test-without-building (workbench accessibility audits)
        working-directory: uifn/examples/swiftui-workbench
        env:
          DESTINATION: ${{ steps.destination.outputs.destination }}
          RESULT: ${{ runner.temp }}/swiftui-workbench-${{ matrix.platform }}.xcresult
          # xcodebuild passes it to the test runner without the prefix, so the
          # README waiver table test fails instead of skipping.
          TEST_RUNNER_UIFN_WORKBENCH_REQUIRE_README: "1"
        run: |
          xcodebuild test-without-building -project SwiftUIWorkbench.xcodeproj -scheme SwiftUIWorkbench \
            -destination "$DESTINATION" -resultBundlePath "$RESULT"
      # Kept on success too: the result bundle lists each audit and the issues
      # it waived.
      - name: Upload the audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swiftui-workbench-${{ matrix.platform }}-xcresult
          path: ${{ runner.temp }}/swiftui-workbench-${{ matrix.platform }}.xcresult
          if-no-files-found: ignore

  tokens:
    name: Swift tokens match their themes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build @uifn/tokens and @uifn/theme
        run: ./node_modules/.bin/turbo run build --filter=@uifn/theme
      # These tests read the default theme JSON and the committed Swift theme,
      # which turbo does not track as @uifn/tokens inputs.
      - name: "@uifn/tokens tests (conversion vectors and the committed default theme)"
        run: npm test --workspace=@uifn/tokens
      - name: Regenerating the committed Swift tokens produces no diff
        run: |
          node uifn/swift/scripts/generate-tokens.mjs
          git diff --exit-code -- uifn/swift
          test -z "$(git status --porcelain -- uifn/swift)"
      # The catalog lists every public UIFnSwiftUI style and component and maps
      # each to a primitive; a Swift-only change does not run the catalog's
      # own tests, so the verifier runs here.
      - name: The uifn catalog's SwiftUI status lists every UIFnSwiftUI style and component
        run: node scripts/verify-uifn-catalog.mjs
