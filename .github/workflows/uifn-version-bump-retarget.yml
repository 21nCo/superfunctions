name: UIFn version bump on edit

# Changing a PR's base branch only emits `edited`, which ci.yml does not run on, so a PR retargeted to dev
# would never meet the version gate. This reruns only that job, under the same check name, on every edit
# to a PR into dev: skipping it on title or body edits would leave a newer skipped check that hides a
# failed one, and adding `edited` to ci.yml would rerun all of CI on every edit. Its steps match the ci.yml job.
on:
  pull_request:
    types: [edited]
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: uifn-version-bump-edit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  uifn-version-bump:
    name: UIFn version bump
    runs-on: ubuntu-latest
    steps:
      # The PR merge ref, which holds the checker even for a branch made before it; the gate first checks that it merges base.sha and head.sha.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify version bump checker
        run: node --test scripts/verify-uifn-version-bump.test.mjs

      - name: Require version bump and changelog entry for shipped uifn changes
        run: |
          git rev-parse HEAD^1 HEAD^2 | diff - <(printf '%s\n' "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}") || { echo "::error::The PR merge ref is not a merge of base ${{ github.event.pull_request.base.sha }} and head ${{ github.event.pull_request.head.sha }} (stale after a retarget); push or edit the PR to run this check again."; exit 1; }
          node scripts/verify-uifn-version-bump.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Report uifn changes since last published tags
        run: node scripts/verify-uifn-version-bump.mjs --since-published --head "${{ github.event.pull_request.base.sha }}"
