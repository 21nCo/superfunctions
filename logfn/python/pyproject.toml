[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logfn"
version = "0.0.1"
description = "Structured logging for Python with redaction, sampling and bounded transports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "21n" }
]
keywords = ["logging", "structured-logging", "json", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/21nCo/super-functions"
Issues = "https://github.com/21nCo/super-functions/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/logfn"]

[tool.hatch.build.targets.sdist]
include = ["src/logfn", "tests", "scripts", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["logfn"]
exclude = '^(build|dist|tests|scripts)(/|$)'

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
