[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logfn"
version = "0.0.1"
description = "Structured logging for Python with pluggable pipelines and transports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "21n"}
]
keywords = ["logging", "structured-logging", "json", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]

dependencies = [
    "httpx>=0.27.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
http = ["superfunctions-core>=0.1.1"]
dev = [
    "build>=1.0.0",
    "superfunctions-core>=0.1.1; python_version >= '3.10'",
    "superfunctions-fastapi>=0.1.1; python_version >= '3.10'",
    "superfunctions-flask>=0.1.1; python_version >= '3.10'",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "respx>=0.21.0", # for mocking HTTP requests in tests
]

[project.urls]
Repository = "https://github.com/21nCo/super-functions"
Issues = "https://github.com/21nCo/super-functions/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["logfn*"]

[tool.setuptools.package-data]
logfn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=logfn --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
exclude = '^(build|dist)/'
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# HTTP is optional; its shared types are checked when the HTTP extra is installed.
[[tool.mypy.overrides]]
module = ["superfunctions.*"]
ignore_missing_imports = true
