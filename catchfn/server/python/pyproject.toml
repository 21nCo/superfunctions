[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catchfn"
version = "0.0.1"
description = "Server implementation for CatchFn bug reporting"
readme = "README.md"
authors = [
    { name = "21n", email = "hello@21n.co" }
]
requires-python = ">=3.8"
dependencies = [
    "sfns",
    "pydantic"
]

[tool.hatch.build.targets.wheel]
packages = ["src/catchfn"]
