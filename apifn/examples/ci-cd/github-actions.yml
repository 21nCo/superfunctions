name: API Contract Check

on:
  pull_request:

# Minimum caller permissions. The reusable workflow declares both and cannot elevate the caller token, so a caller
# without pull-requests: write fails at startup even with post_pr_comment: false. Only its api-check job, which runs
# none of this repository's code, gets pull-requests: write; the evaluate job that runs the router gets contents: read.
# Require "api-check / api-check" as the status check.
permissions:
  contents: read
  pull-requests: write

jobs:
  api-check:
    # Same-repo callers can use: uses: ./.github/workflows/apifn-api-check.yml
    # Pin a commit or release tag instead of @dev for an immutable workflow.
    uses: 21nCo/superfunctions/.github/workflows/apifn-api-check.yml@dev
    with:
      # apifn check from the router: fails on spec drift, an invalid spec or a breaking change without a major bump.
      router_path: src/router.ts
      config_path: apifn.config.ts
      spec_path: .apifn/openapi.yml
      working_directory: .
      base_branch: main
      allow_breaking: false
      post_pr_comment: true
      # Optional: collection tests. Without collection_dir the summary reports them as not run.
      # collection_dir: .apifn/collection
      # environment: development
