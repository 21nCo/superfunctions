[project]
name = "userfn"
version = "0.1.0"
description = "UserFn Python SDK"
authors = [{name = "Antigravity", email = "antigravity@google.com"}]
dependencies = []
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
surveys = ["httpx>=0.27,<1"]
exposures = ["httpx>=0.27,<1"]
config = ["cryptography>=41.0", "httpx>=0.27,<1"]
dev = [
    "build>=1.0",
    "pytest>=7.0",
    "mypy>=1.0",
    "httpx>=0.27,<1",
    "cryptography>=41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/userfn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
